schema_version: 2
shift_hours: 4
slots_types:
  - id: rotating_slot
    name: שמירה
    pattern: rotating
  
  - id: kitchen
    name: מטבח
    pattern: full_day
    config:
      start: 06:00
      end: 22:00
      rest_after_hours: 6
      weight_multiplier: 0.5
      headcount: 2
      
  - id: carmel
    name: כרמל
    pattern: full_day_team
    # optional: skip this slot type on these weekdays
    disabled_weekdays: []
    config:
      start: "09:00"
      end: "09:00"
      rest_after_hours: 0
      weight_multiplier: 1.0
      hours_factor: 0.33
      headcount: 10
      type_quotas:
        A: 1
        B: 2
        C: 1
  - id: rasar
    name: רסר
    pattern: full_day
    disabled_weekdays:
      - friday
      - saturday
    config:
      start: 06:00
      end: 22:00
      rest_after_hours: 6
      weight_multiplier: 0.4
      headcount: 1
  
  - id: valero
    name: בית ולרו
    pattern: rotating

