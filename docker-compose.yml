# Local stack for macOS (and Linux): Postgres + API (UI baked into the API image).
# Usage:
#   cp .env.example .env   # optional: edit passwords
#   docker compose up --build
# Then open http://localhost:8080 (UI) and http://localhost:8080/health .
#
# Migrations run automatically when the API starts. Data persists in volume `pgdata`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-guard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://guard@db:5432/guard?sslmode=disable}
      HTTP_ADDR: "0.0.0.0:8080"
      STATIC_DIR: /app/web/dist
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      API_KEY: ${API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
